name: Build MySafe APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Permet de lancer le build manuellement depuis GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ☕ Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔑 Rendre Gradle exécutable
        run: chmod +x gradlew

      - name: 🛠️ Construire l'APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 📦 Téléverser l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: MySafe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
